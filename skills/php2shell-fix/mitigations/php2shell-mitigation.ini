; PHP2Shell temporary mitigations (CVE-2026-109618, CVE-2026-109619)
; Source: PHP security announcement, 21 Oct 2026 (php.net/archive/2026.php)
;
; THESE DO NOT FIX THE BUG. They make attacks harder until you can upgrade.
; Set them at server level and restart all PHP workers afterwards.
; Do NOT use ini_set() or .user.ini: they apply too late in the request.

; ---------------------------------------------------------------------------
; A) Plain php.ini (mod_php, php-cgi, LiteSpeed)
; ---------------------------------------------------------------------------

; CVE-2026-109618 (out-of-memory corruption)
memory_limit = -1
; Pair memory_limit = -1 with a container or cgroup memory limit so a runaway
; worker gets killed instead of the whole host. Do not use RLIMIT_AS/RLIMIT_DATA.
post_max_size = 8M
; Use 32M instead if the site needs file uploads, and keep upload_max_filesize below it.
upload_max_filesize = 6M

; CVE-2026-109619 (stale global state)
session.upload_progress.enabled = 0
; PHP 8.5 only:
; fatal_error_backtraces = 0

; ---------------------------------------------------------------------------
; B) PHP-FPM pool (e.g. /etc/php/8.3/fpm/pool.d/www.conf), copy without the ";"
; ---------------------------------------------------------------------------
; php_admin_value[memory_limit] = -1
; php_admin_value[post_max_size] = 8M
; php_admin_value[upload_max_filesize] = 6M
; php_admin_flag[session.upload_progress.enabled] = off
; php_admin_flag[fatal_error_backtraces] = off      ; PHP 8.5 only
; pm.max_requests = 1                               ; optional, costs performance
;
; Then: sudo systemctl restart php8.3-fpm   (use your version)

; ---------------------------------------------------------------------------
; C) Apache mod_php (vhost or apache2.conf), copy without the ";"
; ---------------------------------------------------------------------------
; php_admin_value memory_limit -1
; php_admin_value post_max_size 8M
; php_admin_value upload_max_filesize 6M
; php_admin_flag  session.upload_progress.enabled off
;
; Then: sudo systemctl restart apache2   (or httpd)

; ---------------------------------------------------------------------------
; D) Web server / proxy limits (recommended alongside the above)
; ---------------------------------------------------------------------------
; nginx:  client_max_body_size 8m;
; Apache: LimitRequestBody 8388608
;         LimitRequestFields 50
; Block multipart/form-data requests on sites that never accept uploads.
